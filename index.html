<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>aaliSoft</title>
<meta name="description" content="aaliSoft: websites and apps built for businesses.">
<link rel="icon" href="assets/aalisoft-logo.png">
<style>
:root{--ink:#0e1222;--muted:#5b6275;--bg:#ffffff;--line:#e6e9f0;--a:#3b7bf7;--b:#57c4f9}
@media (prefers-color-scheme:dark){:root{--ink:#f2f5fb;--muted:#9aa3b8;--bg:#0b0e1a;--line:#1f2538}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.logo{width:min(320px,70vw);height:auto;display:block;margin:0 auto 28px;border-radius:12px}
@media (prefers-color-scheme:dark){.logo{background:#fff;padding:14px 22px}}
h1{margin:0 0 10px;font-size:clamp(1.4rem,4vw,1.9rem);font-weight:700;letter-spacing:-.01em}
p{margin:0 auto 28px;max-width:34rem;color:var(--muted)}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-block;padding:12px 24px;border-radius:999px;font-weight:600;text-decoration:none;font-size:.95rem}
.primary{color:#fff;background:linear-gradient(90deg,var(--a),var(--b))}
.ghost{color:var(--ink);border:1px solid var(--line)}
.btn:hover{opacity:.9}
footer{margin-top:48px;color:var(--muted);font-size:.8rem}
</style>
</head>
<body>
<main>
  <a href="https://aalisoft.com" aria-label="aaliSoft"><img class="logo" src="assets/aalisoft-logo.png" alt="aaliSoft"></a>
  <h1>Websites and apps, built properly.</h1>
  <p>aaliSoft designs and develops modern websites and mobile apps for businesses in Rawalpindi, Islamabad and beyond.</p>
  <div class="btns">
    <a class="btn primary" href="https://aalisoft.com">Visit aalisoft.com</a>
    <a class="btn ghost" href="https://wa.me/923459028410">Chat on WhatsApp</a>
  </div>
</main>
<footer>&copy; 2026 aaliSoft</footer>
</body>
</html>
